[package]
name = "zeroconverter-core"
version = "0.1.1"
description = "ZeroConverter's conversion engine: formats, validation, jobs. No UI, no Tauri."
authors = ["ZeroFoundry"]
license = "MIT"
publish = false
edition = "2021"

[features]
default = ["mp3"]
# MP3 encoding through LAME (LGPL, linked statically). Off: MP3 can still be
# read, but not written.
mp3 = ["dep:mp3lame-encoder"]
# The app's one-time FFmpeg download (HTTP + zip). The command line leaves it
# off, so it links no network client at all.
ffmpeg-download = ["dep:ureq", "dep:zip"]

[dependencies]
zero_fs = { path = "../zero_fs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
image = { version = "0.25", features = ["webp", "png", "jpeg", "qoi"] }
symphonia = { version = "0.5", features = ["wav", "mp3", "pcm", "flac", "ogg", "vorbis", "aiff", "aac", "isomp4", "alac"] }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image"] }
hound = "3.5"
flac-codec = { version = "1.3", default-features = false }
mp3lame-encoder = { version = "0.2", optional = true }
opus-pure = "=0.2.3"
# Lossy WebP: libwebp (BSD-3-Clause, built from source by libwebp-sys). The
# `image` crate only writes lossless WebP.
libwebp-sys = { version = "=0.14.4", default-features = false, features = ["std"] }
sha2 = "0.10"
resvg = { version = "0.44", default-features = false }
usvg = { version = "0.44", default-features = false }
tiny-skia = "0.11"
roxmltree = "0.20"
pdf-writer = { version = "0.12", default-features = false }
miniz_oxide = "0.8"
# Pure-Rust game texture decoders/encoders; no Rayon nested pool.
dds = { version = "0.2.0", default-features = false }
ktx2 = "0.5.0"
rubato = "0.16"
# Only the one-time FFmpeg download uses the network (handlers/video/install.rs,
# behind the `ffmpeg-download` feature).
ureq = { version = "3", default-features = false, features = ["native-tls"], optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
tempfile = "3"
